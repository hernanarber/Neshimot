    <!-- ============ HERO ============ -->

        <div class="shooting"></div>
        <div class="clouds"><i></i><i></i><i></i><i></i></div>
        <svg class="moon" viewBox="0 0 40 40"><path d="M26 4 A16 16 0 1 0 36 30 A13 13 0 1 1 26 4Z"/></svg>
      </div>
      <div class="sun" aria-hidden="true"><div class="sun-glow"></div><div class="sun-disc"></div></div>
      <svg class="dunes" viewBox="0 0 1440 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">

          <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop class="d1a" offset="0"/><stop class="d1b" offset="1"/></linearGradient>

          <linearGradient id="d3" x1="0" y1="0" x2="0" y2="1"><stop class="d3a" offset="0"/><stop class="d3b" offset="1"/></linearGradient>
          <linearGradient id="d4" x1="0" y1="0" x2="0" y2="1"><stop class="d4a" offset="0"/><stop class="d4b" offset="1"/></linearGradient>
          <linearGradient id="ridge" x1="0" x2="1"><stop class="rg" offset="0" stop-opacity="0"/><stop class="rg" offset=".45" stop-opacity=".55"/><stop class="rg" offset="1" stop-opacity="0"/></linearGradient>
        </defs>
        <g class="dune" data-depth="0.08"><path d="M0,560 C180,500 320,470 520,500 C700,527 820,470 1000,455 C1180,440 1320,490 1440,470 L1440,800 L0,800Z" fill="url(#d1)"/><path d="M380,486 C460,480 500,490 560,503 C700,527 820,470 1000,455" fill="none" stroke="url(#ridge)" stroke-width="1.5"/></g>
        <g class="dune" data-depth="0.16"><path d="M0,625 C200,565 380,605 560,590 C760,573 860,525 1060,545 C1240,563 1340,605 1440,585 L1440,800 L0,800Z" fill="url(#d2)"/><path d="M700,575 C800,560 880,525 1060,545 C1160,555 1240,570 1300,585" fill="none" stroke="url(#ridge)" stroke-width="1.2" opacity=".7"/></g>
        <g class="dune" data-depth="0.26"><path d="M0,700 C220,648 420,668 620,656 C820,644 980,604 1180,634 C1300,652 1380,672 1440,662 L1440,800 L0,800Z" fill="url(#d3)"/><path d="M60,682 C200,650 380,664 560,660" fill="none" stroke="url(#ridge)" stroke-width="1" opacity=".55"/></g>
        <g class="dune" data-depth="0.38"><path d="M0,768 C260,728 520,752 760,742 C1000,732 1200,706 1440,726 L1440,800 L0,800Z" fill="url(#d4)"/></g>
      </svg>
      <div class="hero-inner">
        <p class="eyebrow hero-eyebrow"><!--@t:hero.eyebrow--></p>
        <h1 id="hero-title" class="hero-title"><!--@t:hero.title--></h1>
        <p class="hero-scripts" aria-label="<!--@t:hero.scriptsAria-->"><!--@t:hero.scripts--></p>
        <p class="hero-sub"><!--@t:hero.sub--></p>
        <div class="hero-cta">
          <a class="btn btn-primary" href="#practices"><!--@t:hero.explore--></a>
          <button class="btn btn-ghost" type="button" data-begin="physiological-sigh" data-minutes="1">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg><!--@t:hero.reset-->
          </button>
        </div>
      </div>
      <a class="scroll-cue" href="#how" aria-label="<!--@t:hero.scroll-->"><span></span></a>
    </section>

    <!-- ============ HOW ============ -->
    <section class="how" id="how" aria-label="<!--@t:how.aria-->">
      <div class="wrap how-grid">
        <div class="how-item reveal"><span class="how-n">i</span><h2><!--@t:how.1h--></h2><p><!--@t:how.1p--></p></div>
        <div class="how-item reveal"><span class="how-n">ii</span><h2><!--@t:how.2h--></h2><p><!--@t:how.2p--></p></div>
        <div class="how-item reveal"><span class="how-n">iii</span><h2><!--@t:how.3h--></h2><p><!--@t:how.3p--></p></div>
      </div>
    </section>

    <!-- ============ PRACTICES ============ -->
    <section class="section practices pattern-bg" id="practices" aria-labelledby="practices-title">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="eyebrow"><!--@t:practices.eyebrow--></p>
          <h2 id="practices-title" class="section-title"><!--@t:practices.title--></h2>
          <p class="section-lede"><!--@t:practices.lede--></p>
        </header>
        <div class="filters reveal" role="group" aria-label="<!--@t:filter.aria-->"><!--@filters--></div>
        <div class="cards" id="cards"><!--@cards--></div>
      </div>
    </section>

    <!-- ============ CHAPTERS ============ -->
    <section class="chapters" id="chapters" aria-label="<!--@t:chapters.aria-->">
      <div class="wrap"><!--@chapters--></div>
    </section>

    <!-- ============ RITUAL ============ -->
    <section class="section ritual-sec pattern-bg" id="ritual" aria-labelledby="ritual-title">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="eyebrow"><!--@t:ritual.eyebrow--></p>
          <h2 id="ritual-title" class="section-title"><!--@t:ritual.title--></h2>
          <p class="section-lede"><!--@t:ritual.lede--></p>
        </header>
        <div class="rituals"><!--@rituals--></div>
      </div>
    </section>

    <!-- ============ SCIENCE ============ -->
    <section class="section science" id="science" aria-labelledby="science-title">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="eyebrow"><!--@t:science.eyebrow--></p>
          <h2 id="science-title" class="section-title"><!--@t:science.title--></h2>
          <p class="section-lede"><!--@t:science.lede--></p>
        </header>
        <div class="lab reveal">
          <div class="lab-main">
            <div class="lab-legend"><span><i class="sw sw-in"></i><!--@t:lab.breath--></span><span><i class="sw sw-hr"></i><!--@t:lab.hr--></span></div>
            <svg class="lab-chart" id="rsa" viewBox="0 0 640 240" role="img" aria-label="<!--@t:lab.chartAria-->"></svg>
            <div class="lab-control">
              <label for="bpm"><!--@t:lab.bpm--></label>
              <input type="range" id="bpm" min="3" max="20" step="0.5" value="12" />
              <output id="bpm-out" for="bpm">12</output>
            </div>
          </div>
          <aside class="lab-side">
            <p class="lab-stat"><span id="hr-swing">±3</span><small><!--@t:lab.swing--></small></p>
            <svg class="lab-curve" id="curve" viewBox="0 0 260 150" role="img" aria-label="<!--@t:lab.curveAria-->"></svg>
            <p class="lab-note" id="lab-note"><!--@t:lab.n4--></p>
            <p class="lab-fine"><!--@t:lab.fine--></p>
          </aside>
        </div>
        <div class="principles"><!--@principles--></div>
      </div>
    </section>

    <!-- ============ PROGRESS ============ -->
    <section class="section progress pattern-bg" id="progress" aria-labelledby="progress-title">
      <div class="wrap">
        <header class="section-head reveal">
          <p class="eyebrow"><!--@t:progress.eyebrow--></p>
          <h2 id="progress-title" class="section-title"><!--@t:progress.title--></h2>
          <p class="section-lede"><!--@t:progress.lede--></p>
        </header>
        <div class="stats reveal">
          <div class="stat"><span class="stat-v" id="st-streak">0</span><span class="stat-l"><!--@t:stat.streak--></span></div>
          <div class="stat"><span class="stat-v" id="st-week">0</span><span class="stat-l"><!--@t:stat.week--></span></div>
          <div class="stat"><span class="stat-v" id="st-total">0</span><span class="stat-l"><!--@t:stat.total--></span></div>
        </div>
        <div class="progress-grid">
          <div class="panel reveal">
            <h3 class="panel-title"><!--@t:week.title--></h3>
            <svg class="week-chart" id="week" viewBox="0 0 420 180" role="img" aria-label="<!--@t:week.aria-->"></svg>
          </div>
          <div class="panel reveal cp" id="cp">
            <div class="cp-head">
              <span class="cp-icon"><!--@hourglass--></span>
              <div><h3 class="panel-title"><!--@t:cp.title--></h3><p class="panel-sub"><!--@t:cp.sub--></p></div>
            </div>
            <ol class="cp-steps">
              <li><!--@t:cp.s1--></li>
              <li><!--@t:cp.s2--></li>
              <li><!--@t:cp.s3--></li>
            </ol>
            <div class="cp-timer">
              <span class="cp-time" id="cp-time" aria-live="off">0.0</span><span class="cp-unit"><!--@t:cp.unit--></span>
              <button class="btn btn-primary" type="button" id="cp-btn"><!--@t:cp.start--></button>
            </div>
            <p class="cp-result" id="cp-result" aria-live="polite"></p>
            <svg class="cp-chart" id="cp-chart" viewBox="0 0 420 150" role="img" aria-label="<!--@t:cp.chartAria-->"></svg>
            <ul class="cp-list" id="cp-list" aria-label="<!--@t:cp.listAria-->" hidden></ul>
            <p class="lab-fine"><!--@t:cp.fine--></p>
          </div>
        </div>
        <div class="panel diary reveal" id="diary">
          <div class="diary-head">
            <div>
              <h3 class="panel-title"><!--@t:diary.title--></h3>
              <p class="panel-sub"><!--@t:diary.sub--></p>
            </div>
            <div class="diary-actions">
              <button class="btn btn-ghost" type="button" id="diary-new"><!--@t:diary.new--></button>
              <button class="link-btn" type="button" id="diary-export"><!--@t:diary.export--></button>
            </div>
          </div>
          <div class="diary-locked" id="diary-locked" hidden>
            <p><!--@t:diary.locked--></p>
            <button class="btn btn-primary" type="button" id="diary-unlock"><!--@t:diary.unlock--></button>
          </div>
          <form class="diary-compose" id="diary-compose" hidden>
            <label class="field"><span><!--@t:diary.practice--></span><select id="dc-practice"></select></label>
            <label class="field"><span><!--@t:diary.note--></span><textarea id="dc-text" rows="3" maxlength="2000" placeholder="<!--@t:diary.placeholder-->"></textarea></label>
            <div class="diary-row-actions"><button class="btn btn-primary" type="submit"><!--@t:diary.save--></button><button class="link-btn" type="button" id="dc-cancel"><!--@t:diary.cancel--></button></div>
          </form>
          <div class="diary-moods" id="diary-moods" hidden></div>
          <ol class="diary-list" id="diary-list"></ol>
          <p class="diary-empty" id="diary-empty"><!--@t:diary.empty--></p>
          <button class="link-btn diary-more" type="button" id="diary-more" hidden><!--@t:diary.more--></button>
        </div>
        <p class="reset-row"><button class="link-btn" type="button" id="reset-data"><!--@t:reset.btn--></button></p>
      </div>
    </section>

    <!-- ============ SAFETY ============ -->
    <section class="section safety" id="safety" aria-labelledby="safety-title">
      <div class="wrap safety-grid">
        <header class="section-head reveal">
          <p class="eyebrow"><!--@t:safety.eyebrow--></p>
          <h2 id="safety-title" class="section-title"><!--@t:safety.title--></h2>
          <p class="section-lede"><!--@t:safety.lede--></p>
        </header>
        <ul class="safety-list"><!--@safety--></ul>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <a class="brand" href="#top"><!--@star--><span><!--@t:brand--></span></a>
      <p class="footer-line"><!--@t:footer.line--></p>
      <div class="credit">
        <a class="credit-logo" href="<!--@bti-->" target="_blank" rel="noopener" aria-label="<!--@t:bti.aria-->"><span class="bti-logo"></span></a>
        <p class="credit-text"><!--@credit--></p>
      </div>
      <p class="footer-fine"><!--@t:footer.fine--> · <a href="<!--@t:privacy.href-->"><!--@t:footer.privacy--></a> · <a href="<!--@otherurl-->" hreflang="<!--@otherlang-->" lang="<!--@otherlang-->" data-lang-to="<!--@otherlang-->"><!--@othername--></a></p>
      <a class="powered" href="https://arbertech.com/" target="_blank" rel="noopener" aria-label="<!--@t:powered.aria-->"><svg class="at-mark" viewBox="0 0 672 502" aria-hidden="true"><path class="at-a" d="M0 0H320V143L140.5 502H62.6L252 123.2V68H0Z"/><path class="at-a" d="M259.5 333H412.5L446.5 401H225.5Z"/><path class="at-b" d="M672 0H352V143L531.5 502H609.4L420 123.2V68H672Z"/></svg><span><!--@t:powered.text--></span></a>
    </div>
  </footer>

  <!-- ============ PRACTICE OVERLAY ============ -->
  <div class="practice" id="practice" role="dialog" aria-modal="true" aria-labelledby="pr-title" hidden data-phase="prep" data-view="setup">
    <div class="pr-sky" aria-hidden="true"><div class="stars" id="pr-stars"></div></div>
    <canvas class="pr-sand" id="sand" aria-hidden="true"></canvas>
    <svg class="pr-dunes" viewBox="0 0 1440 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path class="pd1" d="M0,150 C200,100 380,130 560,118 C760,104 880,70 1080,88 C1240,102 1340,130 1440,118 L1440,300 L0,300Z"/>
      <path class="pd2" d="M0,215 C240,178 460,200 700,190 C940,180 1180,160 1440,182 L1440,300 L0,300Z"/>
      <path class="pd3" d="M0,265 C300,240 620,258 900,250 C1140,243 1300,232 1440,240 L1440,300 L0,300Z"/>
    </svg>

    <header class="pr-top">
      <div class="pr-titles">
        <p class="eyebrow" id="pr-item"><!--@t:pr.item--></p>
        <h2 id="pr-title" class="pr-title"><!--@t:pr.title--></h2>
      </div>
      <button class="icon-btn" type="button" id="pr-close" aria-label="<!--@t:pr.close-->">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- setup -->
    <section class="pr-setup" id="pr-setup" aria-label="<!--@t:setup.aria-->">
      <div class="setup-card">
        <p class="setup-welcome" id="su-welcome" hidden></p>
        <p class="setup-pattern" id="su-pattern"></p>
        <div class="setup-plan" id="su-plan"></div>
        <div class="setup-row" id="su-dose-row">
          <span class="setup-label" id="su-dose-label"><!--@t:setup.duration--></span>
          <div class="seg" id="su-dose" role="radiogroup" aria-labelledby="su-dose-label"></div>
        </div>
        <p class="setup-note" id="su-note" hidden></p>
        <div class="setup-row">
          <label class="setup-label" for="su-pace"><!--@t:setup.pace--></label>
          <div class="pace">
            <span><!--@t:setup.faster--></span>
            <input type="range" id="su-pace" min="0.75" max="1.5" step="0.05" value="1" />
            <span><!--@t:setup.slower--></span>
          </div>
        </div>
        <p class="setup-calc" id="su-calc"></p>
        <div class="setup-caution" id="su-caution" hidden>
          <p><strong><!--@t:setup.before--></strong><span id="su-caution-text"></span></p>
          <a class="link-btn" id="su-caution-link" href="#safety"><!--@t:setup.safetyLink--></a>
          <label class="ack" id="su-ack-row" hidden><input type="checkbox" id="su-ack" /> <span><!--@t:setup.ack--></span></label>
        </div>
        <div class="toggles">
          <button class="toggle" type="button" data-pref="sound" aria-pressed="true"><span class="tg"></span><!--@t:tg.sound--></button>
          <button class="toggle" type="button" data-pref="wind" aria-pressed="false"><span class="tg"></span><!--@t:tg.wind--></button>
          <button class="toggle" type="button" data-pref="voice" aria-pressed="false" id="tg-voice"><span class="tg"></span><!--@t:tg.voice--></button>
          <button class="toggle" type="button" data-pref="haptic" aria-pressed="true" id="tg-haptic"><span class="tg"></span><!--@t:tg.haptic--></button>
        </div>
        <div class="setup-actions">
          <button class="btn btn-primary btn-lg" type="button" id="su-start">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg><!--@t:setup.start-->
          </button>
          <button class="link-btn" type="button" id="su-preview" aria-pressed="false"><!--@t:setup.preview--></button>
        </div>
      </div>
    </section>

    <!-- sign-up (after the first free session) -->
    <section class="pr-gate" id="pr-gate" aria-labelledby="gate-title">
      <div class="setup-card gate-card">
        <p class="eyebrow"><!--@t:gate.eyebrow--></p>
        <h3 class="gate-title" id="gate-title"><!--@t:gate.title--></h3>
        <p class="gate-sub" id="gate-sub"><!--@t:gate.sub--></p>
        <form id="gate-form" novalidate>
          <label class="field"><span><!--@t:gate.name--></span><input id="g-name" name="name" type="text" autocomplete="name" maxlength="100" required /></label>
          <label class="field"><span><!--@t:gate.email--></span><input id="g-email" name="email" type="email" autocomplete="email" inputmode="email" maxlength="254" required dir="ltr" /></label>
          <div class="hp" aria-hidden="true"><label>Website<input name="website" id="g-website" type="text" tabindex="-1" autocomplete="off" /></label></div>
          <label class="ack gate-consent"><input type="checkbox" id="g-consent" /> <span><!--@t:gate.consent--></span></label>
          <p class="gate-error" id="g-error" role="alert"></p>
          <button class="btn btn-primary btn-lg" type="submit" id="g-submit"><!--@t:gate.submit--></button>
        </form>
        <p class="gate-privacy"><!--@t:gate.privacy--> <a href="<!--@t:privacy.href-->" target="_blank" rel="noopener"><!--@t:footer.privacy--></a> · <a href="mailto:hernan@arbertech.com">hernan@arbertech.com</a></p>
      </div>
    </section>

    <!-- stage -->
    <section class="pr-stage" id="pr-stage" aria-label="<!--@t:stage.aria-->">
      <div class="orb" id="orb">
        <div class="orb-halo"></div>
        <!--@figure-->
        <svg class="orb-ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="49"/>
          <circle class="ring-prog" id="ring" cx="50" cy="50" r="49"/>
        </svg>
        <div class="nostrils" id="nostrils" hidden aria-hidden="true">
          <span data-side="left"><!--@t:stage.left--></span><span class="ns-bridge"></span><span data-side="right"><!--@t:stage.right--></span>
        </div>
      </div>
      <div class="orb-caption">
        <p class="cue" id="cue"><!--@t:cue.ready--></p>
        <p class="count" id="count"></p>
      </div>
      <p class="hint" id="hint"></p>
      <p class="pr-round" id="round"></p>
    </section>

    <!-- done -->
    <section class="pr-done" id="pr-done" aria-label="<!--@t:done.aria-->">
      <div class="done-mark"><!--@figuredone--></div>
      <h3 class="done-title"><!--@t:done.title--></h3>
      <p class="done-sub" id="done-sub"></p>
      <p class="done-streak" id="done-streak"></p>
      <div class="done-unlock" id="done-unlock" hidden>
        <p><!--@t:done.unlockText--></p>
        <button class="btn btn-ghost" type="button" id="done-unlock-btn"><!--@t:done.unlockBtn--></button>
      </div>
      <div class="mood" id="mood" role="group" aria-labelledby="mood-q">
        <p class="mood-q" id="mood-q"><!--@t:mood.q--></p>
        <div class="mood-opts">
          <button type="button" data-mood="calmer" aria-pressed="false"><!--@t:mood.calmer--></button>
          <button type="button" data-mood="same" aria-pressed="false"><!--@t:mood.same--></button>
          <button type="button" data-mood="energised" aria-pressed="false"><!--@t:mood.energised--></button>
        </div>
        <p class="mood-thanks" id="mood-thanks" hidden><!--@t:mood.thanks--></p>
      </div>
      <form class="done-note" id="done-note" hidden>
        <label class="sr-only" for="dn-text"><!--@t:dn.label--></label>
        <textarea id="dn-text" rows="2" maxlength="2000" placeholder="<!--@t:dn.placeholder-->"></textarea>
        <div class="diary-row-actions"><button class="btn btn-ghost" type="submit" id="dn-save"><!--@t:dn.save--></button><span class="dn-saved" id="dn-saved" role="status" hidden><!--@t:dn.saved--></span></div>
      </form>
      <div class="setup-actions">
        <button class="btn btn-primary" type="button" id="done-close"><!--@t:done.close--></button>
        <button class="link-btn" type="button" id="done-again"><!--@t:done.again--></button>
      </div>
    </section>

    <footer class="pr-bar" id="pr-bar">
      <div class="pr-progress" aria-hidden="true"><div class="pr-progress-fill" id="prog"></div><div class="pr-ticks" id="pr-ticks"></div></div>
      <div class="pr-controls">
        <span class="pr-time" id="t-el">0:00</span>
        <button class="icon-btn" type="button" id="btn-sound" aria-label="<!--@t:bar.mute-->" aria-pressed="false">
          <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="currentColor"/><path d="M16 9.5l5 5M21 9.5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="play" type="button" id="btn-play" aria-label="<!--@t:bar.pause-->">
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5h2.6v13H8zM13.4 5.5H16v13h-2.6z" fill="currentColor"/></svg>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        </button>
        <button class="icon-btn" type="button" id="btn-restart" aria-label="<!--@t:bar.restart-->">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 107-7H8.5M8.5 5V1.8M8.5 5l3 2.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="pr-time pr-time-r" id="t-rem">0:00</span>
      </div>
    </footer>
    <div class="pr-confirm" id="pr-confirm" hidden>
      <div class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-text">
        <p class="confirm-title" id="cf-title"><!--@t:cf.end--></p>
        <p class="confirm-text" id="cf-text"></p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" type="button" id="cf-cancel"><!--@t:cf.keep--></button>
          <button class="btn btn-primary" type="button" id="cf-ok"><!--@t:cf.endBtn--></button>
        </div>
      </div>
    </div>
    <div class="sr-only" aria-live="polite" id="pr-live"></div>
  </div>

  <script type="module" src="/js/app.js?v=<!--@version-->"></script>
</body>
</html>
